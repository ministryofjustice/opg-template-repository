services:
  {{APP_NAME}}:
    image: {{APP_NAME}}:local
    build:
      dockerfile: docker/Dockerfile
    ports:
      - "{{PORT}}:{{PORT}}"
    privileged: false
    user: app-user
    read_only: false
    environment:
      PORT: {{PORT}}
      PREFIX: {{URL_PREFIX}}
      HEALTHCHECK: {{URL_PREFIX}}/health-check
      SIRIUS_PUBLIC_URL: http://localhost:8080
      BACKEND_URL: http://{{SERVICE_NAME}}-api:7171
      JWT_SECRET: mysupersecrettestkeythatis128bits

  watch-assets:
    image: node:26-alpine3.23@sha256:44a3247313f9bc069a4ec25d01b66254ed7dc4d0408727d8720dc827f0753423
    working_dir: /home/node/app
    entrypoint: ["sh"]
    volumes:
      - ./:/home/node/app
      - watch-assets-node-modules:/home/node/app/node_modules
