services:
  {{APP_NAME}}:
    image: {{APP_NAME}}:local
    build:
      dockerfile: docker/Dockerfile
    ports:
      - "{{PORT}}:{{PORT}}"
    privileged: false
    user: app-user
    read_only: false
    environment:
      PORT: {{PORT}}
      PREFIX: {{URL_PREFIX}}
      HEALTHCHECK: {{URL_PREFIX}}/health-check
      SIRIUS_PUBLIC_URL: http://localhost:8080
      BACKEND_URL: http://{{SERVICE_NAME}}-api:7171
      JWT_SECRET: mysupersecrettestkeythatis128bits

  watch-assets:
    image: node:24-alpine3.23@sha256:e44c87c7dd212720eb00469aeac89504ca2be77b8f0d6dbffb30665d5fcc59e1
    working_dir: /home/node/app
    entrypoint: ["sh"]
    volumes:
      - ./:/home/node/app
      - watch-assets-node-modules:/home/node/app/node_modules
